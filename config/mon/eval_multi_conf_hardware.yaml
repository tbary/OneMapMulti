EvalConf:
  multi_object: True
  max_steps: 2000
  max_dist: 1.5
  is_gibson: False
  object_nav_path: "datasets/multiobject_episodes/"
  scene_path: "datasets/scene_datasets/"
  results_path: "results_multi_one"
  log_rerun: True
  n_agents: 1
  use_pointnav: False
  square_im: False
  mode: greedy
  fallback_mode: greedy
  sort_seed: -1

config: [
  ./controller_habitat.yaml, # Not used on hardware; jackal_node.py's own JackalController governs speed
  ./mapping_conf_jackal.yaml,       # Jackal-calibrated mapping configuration (camera at 0.30m)
  ./planning_conf.yaml       # Default Planning Configuration
]